# infrastructure/docker-compose.yml
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mlops_metrics
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
  
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus_config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_config/dashboards:/etc/grafana/provisioning/dashboards
  
  airflow-webserver:
    image: apache/airflow:2.5.0
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      - postgres
  
  mlops-data-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://mlops:mlops_password@postgres:5432/mlops_metrics
    depends_on:
      - redis
      - postgres
      - elasticsearch
  
  mlops-prediction-service:
    build:
      context: .
      dockerfile: Dockerfile.prediction
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_PATH=/app/models
    volumes:
      - ./models:/app/models
    depends_on:
      - redis
  
  mlops-alert-manager:
    build:
      context: .
      dockerfile: Dockerfile.alerts
    environment:
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/app/config/alert_rules.yaml
    volumes:
      - ./config:/app/config
    depends_on:
      - redis
  
  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  airflow_logs:

# Airflow DAG for orchestration
# infrastructure/airflow_dags/mlops_pipeline_dag.py
from airflow import DAG
from airflow.operators.python import PythonOperator
from airflow.operators.bash import BashOperator
from datetime import datetime, timedelta
import sys
import os

# Add project path
sys.path.append('/opt/airflow/dags/mlops_project')

default_args = {
    'owner': 'mlops-team',
    'depends_on_past': False,
    'start_date': datetime(2024, 1, 1),
    'email_on_failure': True,
    'email_on_retry': False,
    'retries': 1,
    'retry_delay': timedelta(minutes=5)
}

dag = DAG(
    'mlops_realtime_pipeline',
    default_args=default_args,
    description='MLOps Real-time Data Processing and Prediction Pipeline',
    schedule_interval=timedelta(minutes=5),  # Run every 5 minutes
    catchup=False,
    max_active_runs=1
)

def collect_and_process_data():
    """Collect data from all sources and process"""
    from data_sources.collectors.system_metrics_collector import SystemMetricsCollector
    from processing.feature_processor import AdvancedFeatureProcessor
    from processing.data_validator import DataValidator
    
    # Initialize collectors
    collector = SystemMetricsCollector({})
    processor = AdvancedFeatureProcessor({})
    validator = DataValidator({'data_quality': {}})
    
    # Collect data from all sources
    servers = [
        {'id': 'web-server-1', 'host': '10.0.1.10'},
        {'id': 'web-server-2', 'host': '10.0.1.11'},
        {'id': 'db-server-1', 'host': '10.0.1.20'},
        {'id': 'api-server-1', 'host': '10.0.1.30'}
    ]
    
    # Collect metrics
    raw_data = asyncio.run(collector.collect_server_metrics(servers))
    
    # Validate data quality
    validation_results = validator.validate_metrics_data(raw_data)
    
    if validation_results['overall_quality_score'] < 70:
        raise ValueError(f"Data quality too low: {validation_results['overall_quality_score']}")
    
    # Process features
    processed_data = processor.process_real_time_features(raw_data)
    
    return processed_data

def make_predictions(**context):
    """Make predictions on processed data"""
    from models.prediction_service import RealTimePredictionService
    
    # Get processed data from previous task
    processed_data = context['task_instance'].xcom_pull(task_ids='collect_and_process_data')
    
    # Initialize prediction service
    config = {
        'model_path': '/opt/airflow/dags/mlops_project/models',
        'redis': {'host': 'redis', 'port': 6379, 'db': 0}
    }
    
    prediction_service = RealTimePredictionService(config)
    
    # Make predictions
    predictions = asyncio.run(prediction_service.predict_batch(processed_data))
    
    return predictions

def process_alerts(**context):
    """Process alerts based on predictions"""
    from alerts.alert_manager import AlertManager
    
    # Get predictions from previous task
    predictions = context['task_instance'].xcom_pull(task_ids='make_predictions')
    
    # Initialize alert manager
    alert_manager = AlertManager('/opt/airflow/dags/mlops_project/config/alert_rules.yaml')
    
    # Process each prediction for alerts
    all_alerts = []
    for prediction in predictions:
        alerts = asyncio.run(alert_manager.process_prediction(prediction))
        all_alerts.extend(alerts)
    
    return all_alerts

# Define tasks
collect_task = PythonOperator(
    task_id='collect_and_process_data',
    python_callable=collect_and_process_data,
    dag=dag
)

predict_task = PythonOperator(
    task_id='make_predictions',
    python_callable=make_predictions,
    dag=dag
)

alert_task = PythonOperator(
    task_id='process_alerts',
    python_callable=process_alerts,
    dag=dag
)

# Data quality monitoring task
quality_check_task = BashOperator(
    task_id='data_quality_check',
    bash_command='python /opt/airflow/dags/mlops_project/scripts/data_quality_monitor.py',
    dag=dag
)

# Model performance monitoring
model_monitor_task = BashOperator(
    task_id='model_performance_monitor',
    bash_command='python /opt/airflow/dags/mlops_project/scripts/model_performance_monitor.py',
    dag=dag
)

# Set task dependencies
collect_task >> predict_task >> alert_task
collect_task >> quality_check_task
predict_task >> model_monitor_task